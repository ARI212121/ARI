name = "trivia-ivr"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# דפי הממשקים מוטמעים בתוך ה-Worker (src/pages.generated.js),
# כך שאין תלות בהגדרת assets. הם נבנים אוטומטית לפני כל deploy.
[build]
command = "node scripts/build-pages.js"

